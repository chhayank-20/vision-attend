services:
  # 1. Frontend Static Site
  - type: web
    name: vision-attend-frontend
    runtime: static
    buildCommand: cd frontend && pnpm install && pnpm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://<YOUR_HUGGINGFACE_USERNAME>-<YOUR_SPACE_NAME>.hf.space
