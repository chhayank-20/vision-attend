services:
  # 1. Frontend Static Site
  - type: web
    name: vision-attend-frontend
    runtime: static
    buildCommand: cd frontend && pnpm install && pnpm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://chhayank20-vision-attend-backend.hf.space
